[project]
name = "backend-recipie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
